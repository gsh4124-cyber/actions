# Temporary support smoke only. Does NOT clone, copy, or test private Vault sources.
name: Public fallback runner and Global Shorts safety smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/primary-blocker-safe-smoke.yml'
permissions:
  contents: read
concurrency:
  group: public-fallback-safe-smoke
  cancel-in-progress: true
jobs:
  fallback-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm temporary fallback and unchanged Global Shorts support contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import unittest
          class SupportBoundaries(unittest.TestCase):
              def test_primary_stays_owner(self):
                  doc=Path('SUPPORT_SCOPE.md').read_text(encoding='utf-8')
                  self.assertIn('hwangje-vault', doc)
                  self.assertIn('fallback', doc)
                  self.assertIn('다른 Project의 기술 원본을 이 저장소에 두기', doc)
              def test_global_shorts_still_present(self):
                  self.assertTrue(Path('global_shorts_factory/factory_selfcheck.py').is_file())
                  self.assertTrue(Path('global_shorts_factory/harness_v1/test_harness.py').is_file())
              def test_no_private_repository_checkout(self):
                  workflow=Path('.github/workflows/primary-blocker-safe-smoke.yml').read_text(encoding='utf-8')
                  self.assertNotIn('repository: gsh4124-cyber/hwangje-vault',workflow)
                  self.assertNotIn('vault_archive',workflow)
          result=unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromTestCase(SupportBoundaries))
          if not result.wasSuccessful():
              raise SystemExit(1)
          print('FALLBACK_RUNNER_AND_ISOLATION_SMOKE_PASS')
          print('PRIVATE_VAULT_REGRESSION_NOT_EXECUTED')
          PY
      - name: Run existing public Global Shorts owner smoke without altering assets
        shell: bash
        run: |
          set -euo pipefail
          python global_shorts_factory/factory_selfcheck.py
          (cd global_shorts_factory/harness_v1 && python -m unittest -q test_harness.py test_proof_gate.py)
          echo "GLOBAL_SHORTS_EXISTING_TESTS_PASS"
      - name: Return clear proof boundary
        run: |
          echo "PRIMARY_RUNNER_BLOCKED_BY_BILLING"
          echo "SUPPORT_ONLY; NO_PRIVATE_VAULT_SOURCE; NO_PRODUCTION_OWNER_CHANGE"
          echo "FULL_PRIMARY_REGRESSION_STILL_UNVERIFIED"
