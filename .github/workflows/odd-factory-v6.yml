name: Odd Factory V6 Blender render
on:
  push:
    branches: [main]
    paths:
      - 'global-shorts/odd_factory_v6.py'
      - 'global-shorts/validate_release.py'
      - 'global-shorts/test_release_gate.py'
      - '.github/workflows/odd-factory-v6.yml'
  pull_request:
    paths:
      - 'global-shorts/**'
      - '.github/workflows/odd-factory-v6.yml'
  workflow_dispatch:
concurrency:
  group: odd-factory-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libgles2 libopengl0 libxrender1 libxkbcommon0
          blender --version
          ffmpeg -version | head -n 1
      - name: Syntax and release gate regression tests
        run: |
          python3 -m py_compile global-shorts/odd_factory_v6.py global-shorts/validate_release.py
          python3 global-shorts/test_release_gate.py
      - name: Smoke render (cheap Blender execution test)
        run: |
          mkdir -p output
          set -o pipefail
          ODD_FACTORY_SMOKE=1 blender -b -t 2 --python global-shorts/odd_factory_v6.py 2>&1 | tee output/smoke.log
          test -s output/smoke.png
      - name: Render canonical scene
        run: |
          mkdir -p output
          set -o pipefail
          blender -b -t 2 --python global-shorts/odd_factory_v6.py 2>&1 | tee output/blender.log
          test -s output/diagnostic.png
          test "$(find output -maxdepth 1 -name 'frame_*.png' | wc -l)" -eq 300
      - name: Encode video
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -start_number 1 -i output/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart output/odd_factory_v6.mp4
      - name: Apply commercial clarity overlay
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/odd_factory_v6.mp4 \
            -vf "drawbox=x=60:y=90:w=960:h=150:color=black@0.55:t=fill:enable='lt(t,7.5)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='WHICH PAIR MOVES WRONG?':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=135:enable='lt(t,7.5)',drawbox=x=360:y=745:w=360:h=430:color=0xFF4D4D@0.9:t=14:enable='gte(t,7.5)',drawbox=x=110:y=1550:w=860:h=150:color=black@0.65:t=fill:enable='gte(t,7.5)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CENTER PAIR!':fontcolor=0xFFDD55:fontsize=76:x=(w-text_w)/2:y=1585:enable='gte(t,7.5)'" \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -an -movflags +faststart output/odd_factory_v6_fixed.mp4
          mv output/odd_factory_v6_fixed.mp4 output/odd_factory_v6.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.5 -i output/odd_factory_v6.mp4 -frames:v 1 output/proof_challenge.png
          ffmpeg -hide_banner -loglevel error -y -ss 8.5 -i output/odd_factory_v6.mp4 -frames:v 1 output/proof_reveal.png
      - name: Validate video
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib
          p=pathlib.Path('output/odd_factory_v6.mp4')
          assert p.exists() and p.stat().st_size>100000, 'MP4 missing or too small'
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          v=next(s for s in meta['streams'] if s['codec_type']=='video')
          assert (int(v['width']),int(v['height']))==(1080,1920), 'Unexpected resolution'
          assert v['r_frame_rate']=='30/1', 'Unexpected fps'
          assert 9.9<float(meta['format']['duration'])<10.1, 'Unexpected duration'
          pathlib.Path('output/validation.json').write_text(json.dumps({'status':'TECHNICAL_PASS','resolution':'1080x1920','fps':30,'duration':float(meta['format']['duration']),'visual_qa':'NOT_VERIFIED','video_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'publish_approved':False},indent=2))
          print('Technical validation passed; visual QA still required')
          PY
      - name: Confirm publishing remains blocked without visual QA
        run: |
          if python3 global-shorts/validate_release.py; then
            echo 'Unexpected release approval without visual review' >&2
            exit 1
          fi
          echo 'Correct: publication remains blocked until actual video is reviewed'
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odd-factory-v6-diagnostics
          path: |
            output/smoke.png
            output/smoke.log
            output/diagnostic.png
            output/proof_challenge.png
            output/proof_reveal.png
            output/odd_factory_v6.mp4
            output/validation.json
            output/blender.log
          if-no-files-found: warn
