name: Vault BOOT regression support
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vault-boot-regression-support.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify scoped Vault read access is configured
        env:
          VAULT_READ_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
        run: |
          if [ -z "$VAULT_READ_TOKEN" ]; then
            echo '::error::VAULT_READ_TOKEN is not configured in the support repository; private Vault checkout cannot proceed.'
            exit 1
          fi
      - name: Checkout primary Vault with scoped read access
        uses: actions/checkout@v4
        with:
          repository: gsh4124-cyber/hwangje-vault
          ref: main
          token: ${{ secrets.VAULT_READ_TOKEN }}
          persist-credentials: false
      - name: Execute actual factory BOOT regression
        run: |
          python -m unittest discover -s scripts -p 'test_skill_bootstrap_factory.py' -v
          python -m unittest discover -s scripts -p 'test_skill_bootstrap.py' -v
