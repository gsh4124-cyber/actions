name: Vault BOOT regression support
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vault-boot-regression-support.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout primary Vault with existing runner identity
        uses: actions/checkout@v4
        with:
          repository: gsh4124-cyber/hwangje-vault
          ref: main
          persist-credentials: false
      - name: Execute actual factory BOOT regression
        run: |
          python -m unittest discover -s scripts -p 'test_skill_bootstrap_factory.py' -v
          python -m unittest discover -s scripts -p 'test_skill_bootstrap.py' -v
