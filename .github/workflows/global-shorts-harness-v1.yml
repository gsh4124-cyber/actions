name: actions Global Shorts Harness Recovery Validation

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options:
          - diagnostic
          - recovery
          - temporary_support
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-harness-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Unit tests
        working-directory: global_shorts_factory/harness_v1
        run: python -m unittest -v test_harness.py
      - name: Build reference Odd One Out scene plan
        run: |
          python global_shorts_factory/harness_v1/harness.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/scene_plan.json
          test -s /tmp/harness_v1/scene_plan.json
      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render L1 three-keyframe recovery Visual Proof
        run: |
          python global_shorts_factory/harness_v1/proof_renderer.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/proof
          test -s /tmp/harness_v1/proof/contact_sheet.png
      - name: Render recovery reference episode
        run: |
          python global_shorts_factory/harness_v1/full_renderer.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/render
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 30 -i /tmp/harness_v1/render/frames/frame_%04d.png \
            -i /tmp/harness_v1/render/audio.wav \
            -vf scale=1080:1920:flags=lanczos -c:v libx264 -pix_fmt yuv420p -profile:v high -level 4.2 \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            /tmp/harness_v1/render/final.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate -of json \
            /tmp/harness_v1/render/final.mp4 > /tmp/harness_v1/render/technical_video.json
          ffprobe -v error -show_entries format=duration,size -of json \
            /tmp/harness_v1/render/final.mp4 > /tmp/harness_v1/render/technical_format.json
          ffmpeg -hide_banner -loglevel error -y -i /tmp/harness_v1/render/final.mp4 \
            -vf "select='eq(n,0)+eq(n,30)+eq(n,150)+eq(n,198)+eq(n,264)',scale=180:320,tile=5x1" \
            -frames:v 1 /tmp/harness_v1/render/review_sheet.jpg
          test -s /tmp/harness_v1/render/final.mp4
          test -s /tmp/harness_v1/render/review_sheet.jpg
      - name: Record fallback invocation context
        run: |
          mkdir -p /tmp/harness_v1
          cat > /tmp/harness_v1/support_context.json <<EOF
          {
            "marker": "ACTIONS_GLOBAL_SHORTS_HARNESS_RECOVERY_PASS",
            "role": "SUPPORT_RECOVERY_FALLBACK_ONLY",
            "primary_repository": "gsh4124-cyber/hwangje-vault",
            "support_repository": "gsh4124-cyber/actions",
            "primary_blocker_evidence": "${{ inputs.primary_blocker_evidence }}",
            "support_scope": "${{ inputs.support_scope }}",
            "return_to_primary_plan": "${{ inputs.return_to_primary_plan }}",
            "production_owner_claimed": false
          }
          EOF
      - name: Upload recovery scene plan, Visual Proof, and reference render
        uses: actions/upload-artifact@v4
        with:
          name: actions-global-shorts-harness-recovery-proof
          path: |
            /tmp/harness_v1/support_context.json
            /tmp/harness_v1/scene_plan.json
            /tmp/harness_v1/proof
            /tmp/harness_v1/render/final.mp4
            /tmp/harness_v1/render/review_sheet.jpg
            /tmp/harness_v1/render/render_manifest.json
            /tmp/harness_v1/render/technical_video.json
            /tmp/harness_v1/render/technical_format.json
          retention-days: 3
